<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Login Admin - Silent Hiking ID</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white">Login Admin</h1>
            <p class="text-xs text-slate-400 mt-1">Silent Hiking Indonesia Management</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Username</label>
                <input type="text" id="username" required placeholder="admin" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <button type="submit" id="btnLogin" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-sm transition-all mt-2">
                Masuk Ke Dashboard
            </button>
        </form>
    </div>

<script>
        // Tentukan API_BASE secara dinamis agar berfungsi di Localhost maupun Online/HP
        const API_BASE = window.location.origin.includes('localhost')
            ? 'http://localhost:4008/api'
            : `${window.location.origin}/api`;

        async function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('admin_token', data.token);
                    // Gunakan clean URL '/admin' sesuai rute di server.js Anda
                    window.location.href = '/admin';
                } else {
                    alert(data.message || 'Login gagal.');
                }
            } catch (err) {
                console.error('Login error:', err);
                alert('Koneksi server terputus.');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
